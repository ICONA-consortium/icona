# ICONA repository: https://github.com/icona-consortium/icona
# IMPORTANT: GitHub authentication requires an external OAuth service. See README.md.
backend:
  name: github
  repo: icona-consortium/icona
  branch: main
  base_url: https://icona-decap-auth.ben-harvey.workers.dev
  auth_endpoint: auth
  open_authoring: true
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /icona/uploads
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: news
    label: News
    folder: src/data/news
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug (URL), name: slug, widget: string, hint: 'Lowercase, hyphenated, unique; do not change after publishing' }
      - { label: Date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { label: Summary, name: summary, widget: text }
      - { label: Body, name: body, widget: text }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Published, name: published, widget: boolean, default: true }
  - name: sites
    label: Research sites
    folder: src/data/sites
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug (URL), name: slug, widget: string }
      - { label: Country, name: country, widget: string }
      - { label: Latitude, name: latitude, widget: number, value_type: float }
      - { label: Longitude, name: longitude, widget: number, value_type: float }
      - { label: Description, name: description, widget: text }
      - label: Site category
        name: category
        widget: select
        required: true
        options:
          - "Shallow cold hydrothermal CO₂ vents"
          - "Shallow warm hydrothermal CO₂ vents"
          - "Groundwater discharge"
          - "Deep hydrothermal CO₂ vents"
          - "Upwelling areas"
          - "Semi-enclosed lagoons"
          - "Warming hotspots"
          - "Naturally saline & hot seas"
          - "Tide pools"
          - "Macrotidal systems"
          - "Fjords"
          - "Inverse estuaries"
          - "Shallow estuaries"
          - "Mangroves"
          - "Biologically driven variable ecosystems"
      - { label: Additional environmental description, name: environment, widget: string, required: false }
      - { label: Linked institution IDs, name: institution_ids, widget: list, required: false, hint: 'Enter institution slugs (e.g. university-of-tsukuba)' }
      - { label: Image, name: image, widget: image, required: false }
      - { label: External website, name: website, widget: string, required: false }
      - { label: Published, name: published, widget: boolean, default: true }
  - name: institutions
    label: Institutions
    folder: src/data/institutions
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug / ID, name: slug, widget: string }
      - { label: Country, name: country, widget: string }
      - { label: City, name: city, widget: string, required: false }
      - { label: Latitude, name: latitude, widget: number, value_type: float }
      - { label: Longitude, name: longitude, widget: number, value_type: float }
      - { label: Description, name: description, widget: text }
      - { label: Linked site IDs, name: site_ids, widget: list, required: false }
      - { label: Website, name: website, widget: string, required: false }
      - { label: Published, name: published, widget: boolean, default: true }
